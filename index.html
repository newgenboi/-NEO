<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101113" />
  <meta name="description" content="NEO HQ — local-first project hub and Work handoff" />
  <title>NEO HQ / Project Hub</title>
  <style>
    :root { color-scheme: dark; --bg:#0d0e0f; --panel:#151719; --panel2:#1c1f21; --surface:#232629; --line:#303336; --fg:#f1f0ea; --muted:#959a9c; --lime:#c4ef85; --amber:#e9c48c; --blue:#a4c5e9; --red:#e5a7a7; --radius:16px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    * {box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)} body{font-size:14px;line-height:1.55} button,input,select,textarea{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.5} a{color:inherit;text-decoration:none} a:hover{text-decoration:underline} ::selection{background:var(--lime);color:#111}
    .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:30px 18px;background:#101113;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:30px}.brand{padding:0 12px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}.brand h1{font-size:27px;letter-spacing:-1.5px;line-height:1.2;margin:6px 0}.brand b{color:var(--lime)}.brand p{font-size:12px;color:var(--muted);margin:5px 0}.nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:12px;background:transparent;color:var(--muted);padding:11px 13px;text-align:left;font-weight:600}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--fg)}.nav .glyph{font-size:16px;line-height:1;width:20px;text-align:center}.nav small{margin-left:auto;color:var(--muted)}.sidefoot{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.sidefoot strong{display:block;color:var(--fg);margin-bottom:4px}.sidefoot .dot{display:inline-block;width:7px;height:7px;background:var(--amber);border-radius:50%;margin-right:5px}
    main{padding:38px clamp(20px,4.5vw,72px) 60px;max-width:1530px;width:100%;margin:0 auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}.topline .intro h2{font-size:clamp(27px,3vw,42px);letter-spacing:-1.65px;line-height:1.2;margin:8px 0}.topline .intro p{margin:0;color:var(--muted);max-width:740px}.topactions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:10px 14px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#5e6568;text-decoration:none}.btn.primary{background:var(--lime);color:#101211;border-color:var(--lime)}.btn.quiet{background:transparent}.btn.sm{padding:6px 10px;font-size:12px}.btn.danger{color:#f2b5b5}.gridstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.stat{padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.stat .n{font-size:30px;line-height:1.2;letter-spacing:-1.4px;font-weight:720;margin:8px 0 2px}.stat p{margin:0;color:var(--muted);font-size:12px}.stat .n small{font-size:13px;letter-spacing:0;color:var(--muted);font-weight:500}
    .sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:28px 0 13px}.sectionhead h3{font-size:18px;letter-spacing:-.35px;margin:0}.sectionhead p{color:var(--muted);font-size:12px;margin:4px 0 0}.projectgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.project{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:20px;min-height:192px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s}.project:hover,.project:focus{border-color:#717770;transform:translateY(-1px);outline:none}.project .head{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}.project h4{font-size:18px;letter-spacing:-.4px;line-height:1.3;margin:7px 0 0}.project .mono{font-size:11px;color:var(--muted)}.project .desc{margin:0;color:#c0c3c2;font-size:13px;flex:1}.project .bottom{display:flex;justify-content:space-between;align-items:center;gap:5px;border-top:1px solid var(--line);padding-top:12px}.project .bottom small{color:var(--muted)}.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;background:#292c2d;border:1px solid #3d4142;border-radius:99px;font-weight:650;font-size:11px;color:#c8c9c4;white-space:nowrap}.tag.warn{background:#382d21;color:#eacda2;border-color:#59442e}.tag.ok{background:#253626;color:#c5efc0;border-color:#466344}.tag.neutral{background:#262a2b;color:#b5bec0}.tag.blue{background:#273443;color:#bbd5f1;border-color:#3f566b}
    .banner{border:1px solid #5b4830;border-radius:14px;background:#2b241b;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 17px;color:#e9d4b8;margin-top:18px}.banner p{margin:3px 0 0;color:#b8a487;font-size:12px}.filters{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.input,.select,.textarea{width:100%;border:1px solid #3b3f40;border-radius:10px;background:#1b1e1f;color:var(--fg);padding:11px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--lime)}.search{max-width:370px;flex:1 1 220px}.filters .select{max-width:200px;flex:1 1 130px}.footnote{font-size:12px;color:var(--muted);margin:18px 0}.empty{border:1px dashed var(--line);padding:48px;border-radius:var(--radius);text-align:center;color:var(--muted)}
    .detailback{background:transparent;border:none;color:var(--muted);padding:0;margin-bottom:20px}.detailback:hover{color:var(--fg)}.detailtop{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detailtop h2{font-size:clamp(26px,3vw,38px);margin:4px 0 5px;letter-spacing:-1px}.detailtop p{color:var(--muted);margin:0;max-width:680px}.twocol{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin:20px 0}.panel{border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:var(--panel);min-width:0}.panel h3{margin:0 0 12px;font-size:16px}.rows{display:flex;flex-direction:column;gap:0}.kv{display:grid;grid-template-columns:152px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}.kv a,.ref a,.inline-link{color:#c4ef85;text-decoration:underline;text-underline-offset:3px}.callout{background:var(--panel2);border-radius:12px;padding:15px 16px;border:1px solid #35393b}.callout strong{color:var(--lime)}.callout p{margin:4px 0 0;color:var(--muted)}.subtle{color:var(--muted)}.event{border-left:2px solid var(--line);margin-left:5px;padding:0 0 18px 17px;position:relative}.event::before{position:absolute;content:"";left:-6px;top:2px;border:2px solid var(--panel);width:9px;height:9px;border-radius:50%;background:#737a7a}.event:last-child{padding-bottom:0}.event strong{display:block}.event small{color:var(--muted)}.event p{margin:4px 0}.pills{display:flex;gap:8px;flex-wrap:wrap}.refgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.ref{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:17px}.ref p{font-size:12px;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{border:1px solid var(--line);background:var(--panel);padding:18px;border-radius:14px}.step strong{display:block;margin-bottom:5px}.step p{color:var(--muted);margin:0;font-size:12px}.backup{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bigcopy{font-size:12px;line-height:1.65;background:#101214;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:390px;overflow:auto}
    .modalwrap{position:fixed;inset:0;z-index:20;background:#000b;display:flex;justify-content:center;align-items:center;padding:12px}.modal{max-width:590px;width:100%;max-height:min(94vh,850px);overflow:auto;background:#191c1d;border:1px solid #495052;border-radius:20px;padding:23px;box-shadow:0 30px 120px #0008}.modalhead{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:17px}.modal h3{margin:0;font-size:21px}.x{border:0;background:transparent;color:var(--muted);font-size:23px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;font-size:12px;color:#c7cdcb}.field small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.modalfooter{margin-top:18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.flash{position:fixed;right:20px;bottom:20px;z-index:40;background:var(--lime);color:#101211;padding:10px 15px;border-radius:11px;box-shadow:0 12px 40px #0007;font-weight:700;max-width:calc(100vw - 40px)}.hidden{display:none!important}
    @media(max-width:1000px){.gridstats{grid-template-columns:repeat(2,1fr)}.refgrid{grid-template-columns:repeat(2,1fr)}.sidebar{width:205px}.shell{grid-template-columns:205px 1fr}.projectgrid{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
    @media(max-width:700px){.shell{display:block}.sidebar{position:fixed;z-index:10;top:auto;bottom:0;left:0;right:0;height:auto;width:auto;padding:5px max(8px,env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);border-right:0;background:#101113f7;backdrop-filter:blur(16px)}.sidebar .brand,.sidebar .sidefoot{display:none}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:0}.nav button{padding:9px 3px;display:flex;flex-direction:column;gap:1px;text-align:center;justify-content:center;border-radius:10px;font-size:10px;white-space:nowrap}.nav .glyph{width:auto;font-size:19px}.nav small{display:none}main{padding:26px 17px calc(105px + env(safe-area-inset-bottom))}.topline{align-items:flex-start;flex-direction:column;margin-bottom:10px}.topactions{width:100%}.gridstats{gap:8px}.stat{padding:15px}.stat .n{font-size:24px}.project{min-height:168px}.refgrid{grid-template-columns:1fr}.backup{grid-template-columns:1fr}.detailtop{flex-direction:column}.kv{grid-template-columns:105px minmax(0,1fr)}.fields{grid-template-columns:1fr}.banner{align-items:flex-start;flex-direction:column}.modal{padding:19px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar"><div class="brand"><div class="eyebrow">CREATIVE OPERATIONS</div><h1>NEO <b>/</b> HQ</h1><p>Make it exist. Then make it better.</p></div><nav class="nav" id="nav"></nav><div class="sidefoot"><strong><span class="dot"></span> Local-first prototype</strong>Data lives in this browser. Export a backup before changing device.</div></aside>
  <main id="app" aria-live="polite"></main>
</div><div id="modalRoot"></div><div id="flash" class="flash hidden" role="status"></div><input type="file" class="hidden" id="fileProjectPack" accept="application/json,.json" aria-label="Select one project merge pack"/>
<script>
(()=>{'use strict';
const KEY='neo-hq-v0.1';
const TODAY='2026-10-22';
const starter=[
 {id:'infinite-ascent',name:'INFINITE ASCENT',category:'Game · RPG',description:'Fantasy survival RPG • pilot for asset + UI → Work/Unity handoff.',version:'v0.5.0 (target reported)',liveUrl:'https://infinite-ascent.thk2k.chatgpt.site/',repoUrl:'',designUrl:'',stage:'Audit',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'Recover and confirm actual latest source/commit and backups before any migration.',notes:'Preserve approved G3/G4 choices, existing gameplay, Blueprint/Root Pack, Before v1 hero sprites. Prior v0.4.2 live build reported; v0.5.0 not source-verified.',priority:'Pilot',evidence:[],decisions:[{date:'2026-10-22',text:'Preserve approved direction; audit → revise → approve → production → Work/Unity.',status:'Reported decision'}]},
 {id:'neofarm',name:'NeoFarm',category:'Game · 3D Farming',description:'Already-built browser farming game; preserve playable web version during any Unity evaluation.',version:'v1.4.0 (reported)',liveUrl:'https://neofarm.thk2k.chatgpt.site/neofarm/v1-4-0/',repoUrl:'',designUrl:'',stage:'Audit',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'Locate actual v1.4.0 source and record deployed commit before changing engine.',notes:'Do not treat the game as unbuilt; preserve farm mechanics and current browser release.',priority:'Pilot',evidence:[],decisions:[]},
 {id:'catsvsdogs',name:'CatsVsDogs — Rooftop Rivalry',category:'Game · 2D Battle',description:'Team-building rooftop battle prototype; additional UI, stages, gacha and effects planned.',version:'Alpha (exact live version unresolved)',liveUrl:'https://catsvsdogs-rooftop-rivalry.thk2k.chatgpt.site/',repoUrl:'',designUrl:'',stage:'Backlog',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'Identify approved Alpha source and stage/roster blueprint before changes.',notes:'Mythic cards retain equal size; flame/motion border effect. Do not alter Production URL without approved plan.',priority:'Later',evidence:[],decisions:[]},
 {id:'juniper-farm',name:'Juniper Farm / PS2 World',category:'Game · 3D World',description:'PS2-inspired summer farm scene and lesson world.',version:'V3.1 (reported)',liveUrl:'https://neo-ps2-farm-world.thk2k.chatgpt.site/',repoUrl:'',designUrl:'',stage:'Backlog',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'Map source ownership and compare V3.1 changes with deployment.',notes:'Project is separate from NeoFarm; do not collapse into the same source without evidence.',priority:'Later',evidence:[],decisions:[]},
 {id:'higgsfield-asset-workspace',name:'Higgsfield Asset Workspace',category:'Tool · Asset Workspace',description:'Lesson 02 visual asset and prompt workspace.',version:'Unverified',liveUrl:'https://lesson02-farmer-asset-workspace-neokitcha.vercel.app/',repoUrl:'',designUrl:'',stage:'Backlog',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'Confirm whether connected Vercel project matches this URL and find source.',notes:'Vercel project lesson02-farmer-asset-workspace is visible; production alias unconfirmed.',priority:'Later',evidence:[],decisions:[]}
];
const refs=[
 {name:'Godly Design',url:'https://godly.design/websites/',use:'Web directions / layouts'},
 {name:'Refero Design',url:'https://refero.design/',use:'Product UI references'},
 {name:'Pinterest',url:'https://www.pinterest.com/',use:'Moodboards and discovery'},
 {name:'Wall of Portfolios',url:'https://www.wallofportfolios.com/',use:'Portfolio art direction'},
 {name:'Awwwards',url:'https://www.awwwards.com/',use:'Web craft / interactions'},
 {name:'Cosmo',url:'https://www.cosmos.so/',use:'Visual discovery / curation'},
 {name:'Eyecandy',url:'https://eyecannndy.com/',use:'Motion reference library'},
 {name:'Behance',url:'https://www.behance.net/',use:'Creative case studies'}
];
const allowedStages=['Backlog','Audit','Design','Approval','Production','QA','Released'];
const defaultState=()=>({schemaVersion:1,createdFrom:'NEO HQ v0.1 starter — conversation evidence, not repository sync',lastSaved:'',projects:structuredClone(starter),decisionLog:[],settings:{}});
let state;let current='overview',activeId=null,q='',stageFilter='All';
function copyObj(o){return JSON.parse(JSON.stringify(o));}
function load(){try{const s=localStorage.getItem(KEY);if(s){const x=JSON.parse(s);if(validate(x)){state=x;return;}}}catch(e){}state=defaultState();}
function validate(x){return !!(x&&x.schemaVersion===1&&Array.isArray(x.projects)&&x.projects.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string')&&x.projects.length<=500);}
function save(){try{state.lastSaved=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('Browser storage unavailable — export backup before closing');return false}}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function validUrl(x){try{const z=new URL(x);return ['https:','http:'].includes(z.protocol)?z.href:''}catch{return ''}}
function link(u,label){let safe=validUrl(u);return safe?`<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(label||u)} ↗</a>`:'<span class="subtle">Not connected</span>'}
function status(s){return `<span class="tag ${s==='Unresolved'||s==='Not checked'||s==='Pending'?'warn':s==='Confirmed'||s==='Approved'||String(s).startsWith('Verified')||s==='Root Pack only'?'ok':'neutral'}">${esc(s||'Unresolved')}</span>`}
function navigate(v,id=null){current=v;activeId=id;render();window.scrollTo({top:0,behavior:'instant'})}
function notify(m){const n=document.querySelector('#flash');n.textContent=m;n.classList.remove('hidden');clearTimeout(notify._t);notify._t=setTimeout(()=>n.classList.add('hidden'),2800)}
function title(head,description,buttons=''){return `<div class="topline"><div class="intro"><div class="eyebrow">NEO HQ / ${esc(current.toUpperCase())} · v0.1.2</div><h2>${esc(head)}</h2><p>${esc(description)}</p></div>${buttons?`<div class="topactions">${buttons}</div>`:''}</div>`}
function buttons(){return `<button class="btn quiet" data-action="export">↓ Export Backup</button><button class="btn primary" data-action="add">＋ New Project</button>`}
function card(p){return `<article class="project" tabindex="0" role="button" data-open="${esc(p.id)}" aria-label="Open ${esc(p.name)}"><div class="head"><div><div class="mono">${esc(p.category)} · ${esc(p.priority||'Later')}</div><h4>${esc(p.name)}</h4></div>${status(p.sourceStatus)}</div><p class="desc">${esc(p.description)}</p><div class="bottom"><small>${esc(p.version||'Version unknown')}</small><span class="tag neutral">${esc(p.stage||'Audit')} →</span></div></article>`}
function summary(){const ps=state.projects;return `<div class="gridstats"><div class="stat"><span class="eyebrow">PROJECTS</span><div class="n">${ps.length}</div><p>Tracked locally</p></div><div class="stat"><span class="eyebrow">PILOTS</span><div class="n">${ps.filter(p=>p.priority==='Pilot').length}</div><p>INFINITE ASCENT + NeoFarm</p></div><div class="stat"><span class="eyebrow">SOURCE EVIDENCE</span><div class="n">${ps.filter(p=>(p.evidence||[]).length>0).length} <small>/ ${ps.length}</small></div><p>Projects with manual evidence</p></div><div class="stat"><span class="eyebrow">APPROVED</span><div class="n">${ps.filter(p=>p.approval==='Approved').length}</div><p>Manually recorded</p></div></div>`}
function overview(){return title('Creative command center','Everything in one view. Pilot the system first; never confuse reported versions with verified code.',buttons())+summary()+`<div class="banner"><div><strong>${state.projects.find(p=>p.id==='infinite-ascent')?.canonicalRecord?'✓ INFINITE ASCENT: new Root Pack v1.0 locked':'⚠ INFINITE ASCENT: canonical document not imported into this browser'}</strong><p>${state.projects.find(p=>p.id==='infinite-ascent')?.canonicalRecord?'Work audited v0.5.0; GitHub remote and physical Safari floor90+ QA remain unresolved. Other projects untouched.':'Root Pack approval exists in Library; use Merge Project Pack to add its registry locally without replacing other projects.'}</p></div><button class="btn sm" data-action="merge-pack">Merge project pack →</button></div><div class="sectionhead"><div><h3>Pilot projects</h3><p>Start here to prove Work handoffs before scaling.</p></div><button class="btn quiet sm" data-nav="projects">All projects →</button></div><div class="projectgrid">${state.projects.filter(p=>p.priority==='Pilot').map(card).join('')}</div><div class="sectionhead"><h3>Next operational steps</h3></div><div class="steps"><div class="step"><span class="eyebrow">01 / AUDIT</span><strong>Recover actual source</strong><p>Record repo, branch, commit and evidence for each pilot.</p></div><div class="step"><span class="eyebrow">02 / DESIGN GATE</span><strong>Reuse approved directions</strong><p>Blueprint → section specification → visual options → approval.</p></div><div class="step"><span class="eyebrow">03 / HANDOFF</span><strong>Prepare Work brief</strong><p>Copy project-specific scope, guardrails and unresolved blockers.</p></div></div>`}
function projects(){let arr=state.projects.filter(p=>(q===''||[p.name,p.category,p.description,p.version].join(' ').toLowerCase().includes(q.toLowerCase()))&&(stageFilter==='All'||p.stage===stageFilter));return title('Project directory','Filter projects and open a record to inspect sources, approved decisions and handoff constraints.',buttons())+`<div class="filters"><input id="filterSearch" class="input search" type="search" value="${esc(q)}" placeholder="Search projects…" aria-label="Search projects"/><select id="stageFilter" class="select"><option value="All">All stages</option>${allowedStages.map(s=>`<option ${stageFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="projectgrid" id="projectGrid">${arr.length?arr.map(card).join(''):'<div class="empty">No matching projects.</div>'}</div><p class="footnote">Project records are browser-local. You can export/import JSON to carry state to Work or another device.</p>`}
function kv(k,v){return `<div class="kv"><dt>${esc(k)}</dt><dd>${v}</dd></div>`}
function canonicalCard(p){const c=p.canonicalRecord;if(!c)return `<div class="panel" style="margin-top:14px"><h3>Canonical Root Pack</h3><p class="subtle">Not imported into this browser. An approved v1.0 pack is available for local project-only merge; other projects will be preserved.</p><button class="btn" data-action="merge-pack">↑ Merge INFINITE ASCENT Project Pack</button></div>`;const d=c.canonical_root_pack||{},src=c.game_source||{},audit=c.audit||{};return `<div class="panel" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>Source of Truth · canonical documentation</h3>${status('Approved')}</div><div class="rows">${kv('Document',esc(d.document_name||'Unresolved'))}${kv('Authority',esc('NEW reconstructed replacement, v1.0 — owner approved '+(d.owner_decision_date||'')))}${kv('Doc SHA-256',`<code style="overflow-wrap:anywhere">${esc(d.sha256||'Unresolved')}</code>`)}${kv('Library',esc(d.library_path||'No link'))}${kv('Live/game',esc(src.version||'Unresolved')+' · '+esc(src.commit||'Commit unresolved'))}${kv('Source scope',esc(src.verification||'Unresolved'))}${kv('GitHub remote',status('Unresolved'))}${kv('Audit verdict',esc(audit.verdict||'Unresolved'))}${kv('Historic Root Pack',esc(d.historical_original||'Unresolved'))}${kv('Old visual approvals',esc(d.historical_approvals_verification||'Reported'))}</div><p class="footnote">Approval here covers the replacement DOCUMENT only. Balance, animation, enemy art, original visual approvals, source edits and Unity are not automatically approved. Data stored only in this browser.</p><button class="btn sm" data-action="merge-pack">↑ Merge updated project pack</button></div>`}
function project(){const p=state.projects.find(x=>x.id===activeId);if(!p)return navigate('projects');return `<button class="detailback" data-nav="projects">← All projects</button><div class="detailtop"><div><div class="eyebrow">${esc(p.category)} · ${esc(p.priority)}</div><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><div class="pills" style="margin-top:12px">${status(p.sourceStatus)} ${status(p.approval)} <span class="tag neutral">${esc(p.stage)}</span></div></div><div class="topactions"><button class="btn" data-action="edit">✎ Edit</button><button class="btn primary" data-action="handoff">↗ Work Handoff</button></div></div>${canonicalCard(p)}<div class="twocol"><section class="panel"><h3>Project source & status</h3><div class="rows">${kv('Version (reported)',esc(p.version||'Unknown'))}${kv('Live link',link(p.liveUrl,p.liveUrl))}${kv('GitHub source',link(p.repoUrl,p.repoUrl))}${kv('Figma / design',link(p.designUrl,p.designUrl))}${kv('Source confidence',status(p.sourceStatus))}${kv('Deployment check',status(p.liveStatus))}${kv('Approval gate',status(p.approval))}${kv('Workflow stage',esc(p.stage))}</div></section><section class="panel"><h3>Next action</h3><div class="callout"><strong>Next verified step</strong><p>${esc(p.next)}</p></div><h3 style="margin-top:23px">Constraints / context</h3><p class="subtle">${esc(p.notes||'No notes recorded.')}</p><div class="topactions"><button class="btn sm" data-action="evidence">＋ Add evidence</button><button class="btn sm" data-action="decision">＋ Record decision</button></div></section></div><div class="twocol"><section class="panel"><h3>Evidence & files <span class="tag neutral">${(p.evidence||[]).length}</span></h3>${(p.evidence||[]).length? [...p.evidence].reverse().map((e,i)=>`<div class="event"><strong>${esc(e.label)}</strong><small>${esc(e.date)} · human-recorded</small><p>${esc(e.note||'')}</p><small>${e.url?link(e.url,'Open evidence'):''}</small>${e.attachment?`<div style="margin-top:10px"><button type="button" class="btn sm" data-action="attachment" data-index="${p.evidence.length-1-i}">↓ ${esc(e.attachment.name)} (${Math.ceil(e.attachment.size/1024)} KB)</button></div>`:''}</div>`).join(''):'<p class="subtle">No linked evidence yet. Versions and statuses remain unverified.</p>'}</section><section class="panel"><h3>Decision log <span class="tag neutral">${(p.decisions||[]).length}</span></h3>${(p.decisions||[]).length?[...p.decisions].reverse().map(e=>`<div class="event"><strong>${esc(e.status||'Decision')}</strong><small>${esc(e.date)}</small><p>${esc(e.text)}</p></div>`).join(''):'<p class="subtle">No local decision entries yet. Original approved designs must be linked, not inferred.</p>'}</section></div>`}
function knowledge(){return title('Knowledge & references','Global discovery sources are pointers, not automatic approval for any project.')+`<div class="sectionhead"><h3>Global visual reference library</h3><p>${refs.length} sources</p></div><div class="refgrid">${refs.map(r=>`<article class="ref"><strong>${esc(r.name)}</strong><p>${esc(r.use)}</p>${link(r.url,'Open reference')}</article>`).join('')}</div><div class="sectionhead"><h3>Governance / source of truth</h3></div><div class="steps"><div class="step"><strong>Blueprint + Root Pack</strong><p>Start with canonical project docs before exploring changes. Source files are not currently linked.</p></div><div class="step"><strong>Design System</strong><p>Use verified tokens, grid and spacing rules; do not substitute general inspiration for approved components.</p></div><div class="step"><strong>Books & principles</strong><p>Preserve existing book references. Names/pages require confirmation from actual source files.</p></div></div><p class="footnote">Project-specific references, original books, and assets will appear when their source links have been recovered; nothing here claims they are synced.</p>`}
function workflow(){return title('Approval workflow','A practical guardrail for design-to-development handoffs.')+`<div class="steps">${[['01 · AUDIT','Inspect the actual repository, deployed build and approved documents. Record evidence and backup.'],['02 · SPEC','Confirm target section, constraints and Keep / Replace / Add; no unrelated changes.'],['03 · VISUAL','Explore alternatives only where needed, compare with locked design direction.'],['04 · APPROVAL','Record an explicit design/feature decision. Visual approval is not mechanics approval.'],['05 · BUILD','Implement on verified source with QA, preserve existing save behavior and backups.'],['06 · HANDOFF','Export a Work brief; merge/deploy only after required approval and tests.']].map(x=>`<div class="step"><span class="eyebrow">STAGE GATE</span><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('')}</div><div class="panel" style="margin-top:17px"><h3>Rules that do not change</h3><p class="subtle">No automatic source recovery, no automatic Figma/Unity connection, no silent merges or production deploys, no unapproved replacement of Blueprint/Root Pack, and no claim of verification without evidence.</p></div>`}
function settings(){return title('Backup & portability','This prototype saves in your browser. It does not silently sync data to GitHub, other devices or ChatGPT.')+`<div class="backup"><section class="panel"><h3>Export snapshot</h3><p class="subtle">Download all project records, decision notes and evidence as a JSON file. Use it as a deliberate handoff / backup.</p><button class="btn primary" data-action="export">↓ Download backup.json</button><p class="footnote">Last saved: ${esc(state.lastSaved||'Not saved yet')}</p></section><section class="panel"><h3>Import snapshot</h3><p class="subtle">Restore from an exported NEO HQ JSON snapshot, including locally saved evidence attachments. Import replaces browser records after confirmation and first exports a safety backup. This is different from adding a .md source file to a project.</p><button class="btn" data-action="import">↑ Import backup.json</button><input id="fileImport" class="hidden" type="file" accept="application/json,.json"/></section></div><div class="panel" style="margin-top:16px"><h3>Merge one project (safe)</h3><p class="subtle">Import a <code>neo-hq.project-merge.v1</code> JSON pack. Preview the exact target project, export a full backup, then add/update only that project. Existing notes, other projects and uploaded attachments are preserved. Repeating the same pack will not duplicate its evidence or decisions.</p><button class="btn primary" data-action="merge-pack">↑ Merge INFINITE ASCENT pack</button><p class="footnote">The old Import backup.json feature ABOVE still replaces the full browser snapshot. This new merge never uses that action.</p></div><div class="panel" style="margin-top:16px"><h3>Architecture notes</h3><div class="rows">${kv('Storage','Local browser only (localStorage)')}${kv('Cross-device sync',status('Not checked')+' <span class="subtle">— not implemented</span>')}${kv('GitHub sync','<span class="subtle">Not connected</span>')}${kv('Automated health checks','<span class="subtle">Not implemented</span>')}${kv('Release','v0.1.2 · project-only merge')}</div></div>`}
function nav(){const items=[['overview','⌂','Overview'],['projects','▦','Projects'],['knowledge','◇','References'],['workflow','↔','Workflow'],['settings','⚙','Backup']];document.querySelector('#nav').innerHTML=items.map(([k,i,n])=>`<button data-nav="${k}" class="${current===k||(current==='detail'&&k==='projects')?'active':''}"><span class="glyph">${i}</span>${n}${k==='projects'?`<small>${state.projects.length}</small>`:''}</button>`).join('')}
function render(){nav();document.querySelector('#app').innerHTML=({overview,projects,detail:project,knowledge,workflow,settings}[current]||overview)()}
function modal(head,body,foot){document.querySelector('#modalRoot').innerHTML=`<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(head)}"><div class="modalhead"><h3>${esc(head)}</h3><button class="x" data-close aria-label="Close">×</button></div>${body}<div class="modalfooter">${foot||'<button class="btn" data-close>Cancel</button>'}</div></div></div>`;document.querySelector('.modal input,.modal textarea,.modal select')?.focus()}
function close(){document.querySelector('#modalRoot').innerHTML=''}
function field(k,label,value='',type='text',full=false){return `<div class="field ${full?'full':''}"><label for="f_${k}">${esc(label)}</label>${type==='textarea'?`<textarea class="textarea" id="f_${k}" rows="3">${esc(value)}</textarea>`:`<input class="input" id="f_${k}" type="${type}" value="${esc(value)}"/>`}</div>`}
function formProject(existing){const p=existing||{name:'',category:'Project',description:'',version:'',liveUrl:'',repoUrl:'',designUrl:'',next:'',notes:'',stage:'Backlog',priority:'Later'};modal(existing?'Edit project':'Create project',`<div class="fields">${field('name','Project name',p.name)}${field('category','Category',p.category)}${field('version','Version — label only',p.version)}<div class="field"><label for="f_stage">Workflow stage</label><select class="select" id="f_stage">${allowedStages.map(s=>`<option ${p.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>${field('description','Short description',p.description,'textarea',true)}${field('liveUrl','Live URL',p.liveUrl,'url',true)}${field('repoUrl','GitHub repository link',p.repoUrl,'url',true)}${field('designUrl','Figma/design link',p.designUrl,'url',true)}${field('next','Next actionable step',p.next,'textarea',true)}${field('notes','Constraints, approved references and notes',p.notes,'textarea',true)}<div class="field"><label for="f_priority">Priority</label><select class="select" id="f_priority"><option ${p.priority==='Pilot'?'selected':''}>Pilot</option><option ${p.priority!=='Pilot'?'selected':''}>Later</option></select></div></div><p class="footnote">Adding a URL does not verify ownership, latest commit, or deployment.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveProject">Save project</button>`);document.querySelector('#saveProject').onclick=()=>{let data={};for(const key of ['name','category','description','version','stage','liveUrl','repoUrl','designUrl','next','notes','priority']){data[key]=document.querySelector('#f_'+key).value.trim()}if(!data.name)return notify('Project name required');if(['liveUrl','repoUrl','designUrl'].some(k=>data[k]&&!validUrl(data[k])))return notify('URLs must use http or https');if(existing){Object.assign(existing,data)}else{let id=data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'project';let base=id,n=2;while(state.projects.some(p=>p.id===id)){id=base+'-'+n++}state.projects.push({id,...data,sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',evidence:[],decisions:[]})}save();close();navigate(existing?'detail':'projects',existing?.id);notify('Project saved locally')};}
function addEvidence(p){modal('Record source evidence',`<div class="fields">${field('label','Evidence label (e.g. commit SHA, Work report)','')}${field('date','Date',new Date().toISOString().slice(0,10),'date')}${field('url','Source URL (optional)','', 'url', true)}<div class="field full"><label for="f_attachment">Attach a file from iPhone / Files (optional)</label><input class="input" style="padding:12px;min-height:52px" type="file" id="f_attachment" accept=".md,.txt,.json,.pdf,.png,.jpg,.jpeg,.webp,text/plain,text/markdown,application/json,application/pdf,image/png,image/jpeg,image/webp"/><small id="attachmentHint">Choose .md, .txt, .json, .pdf, .png, .jpg or .webp · 800 KB maximum. Stored only in this browser and included in JSON backups.</small></div>${field('note','What this evidence actually proves','', 'textarea',true)}</div><p class="footnote">Files are stored locally, not uploaded to a server or sent to ChatGPT Work. A file does NOT automatically prove a deployed version or approval.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveEvidence">Save file / evidence</button>`);document.querySelector('#f_attachment').addEventListener('change',e=>{const f=e.target.files?.[0];document.querySelector('#attachmentHint').textContent=f?`${f.name} · ${Math.ceil(f.size/1024)} KB · local attachment only`:'No file chosen';if(f&&!document.querySelector('#f_label').value.trim())document.querySelector('#f_label').value=f.name});document.querySelector('#saveEvidence').onclick=async()=>{const get=k=>document.querySelector('#f_'+k).value.trim();const file=document.querySelector('#f_attachment').files?.[0];if(!get('label')&&!file)return notify('Enter a label or choose a file');if(!get('note')&&!file)return notify('Explain what the evidence proves');if(get('url')&&!validUrl(get('url')))return notify('Invalid URL');let attachment=null;if(file){if(!/\.(md|txt|json|pdf|png|jpe?g|webp)$/i.test(file.name))return notify('Unsupported file: choose MD, TXT, JSON, PDF or image');if(file.size>800*1024)return notify('File too large (800 KB limit). Use a source URL for larger files.');document.querySelector('#saveEvidence').disabled=true;try{attachment=await readEvidenceFile(file)}catch(e){document.querySelector('#saveEvidence').disabled=false;return notify('Could not read file from Files app')}}const record={label:get('label')||file.name,date:get('date'),url:get('url'),note:get('note')||'File attached for review; authenticity and source are not yet verified.',...(attachment?{attachment}:{})};p.evidence.push(record);if(!save()){p.evidence.pop();document.querySelector('#saveEvidence').disabled=false;return}close();render();notify('Evidence saved in this browser')};}
function readEvidenceFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(reader.error);reader.onload=()=>resolve({name:file.name,size:file.size,type:file.type||'application/octet-stream',dataUrl:String(reader.result)});reader.readAsDataURL(file)})}
function downloadAttachment(e){const a=e?.attachment;if(!a?.dataUrl)return notify('Attachment unavailable');try{const base=a.dataUrl.split(',')[1];const str=atob(base);const bytes=new Uint8Array(str.length);for(let i=0;i<str.length;i++)bytes[i]=str.charCodeAt(i);const blob=new Blob([bytes],{type:a.type||'application/octet-stream'});const url=URL.createObjectURL(blob);const node=document.createElement('a');node.href=url;node.download=a.name;document.body.appendChild(node);node.click();node.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(err){notify('File could not be downloaded')}}
function addDecision(p){modal('Record a project decision',`<div class="fields">${field('date','Date',new Date().toISOString().slice(0,10),'date')}<div class="field"><label for="f_status">Decision type</label><select class="select" id="f_status"><option>Draft</option><option>Approved</option><option>Rejected</option><option>Revision requested</option></select></div>${field('text','Decision, exact scope, Keep/Replace/Add','', 'textarea', true)}</div><p class="footnote">Only select Approved for a decision the project owner explicitly approved. This records the decision; it never grants code-write or deploy permission.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveDecision">Save decision</button>`);document.querySelector('#saveDecision').onclick=()=>{const get=k=>document.querySelector('#f_'+k).value.trim();if(!get('text'))return notify('Decision text required');p.decisions.push({date:get('date'),status:get('status'),text:get('text')});if(get('status')==='Approved')p.approval='Decision recorded';save();close();render();notify('Decision recorded locally')};}
function workText(p){return `# NEO HQ — WORK HANDOFF\nProject: ${p.name}\nPrepared: ${new Date().toISOString().slice(0,10)}\nSource: NEO HQ local snapshot (human-curated; does not equal code audit)\n${p.canonicalRecord?`New Canonical Document: ${p.canonicalRecord.canonical_root_pack.document_name}\nCanonical SHA256: ${p.canonicalRecord.canonical_root_pack.sha256}\nOwner approved document: ${p.canonicalRecord.canonical_root_pack.owner_decision_date}; historical original still missing.\nAudit: ${p.canonicalRecord.audit.verdict}; source commit ${p.canonicalRecord.game_source.commit}; GitHub remote unresolved.\nNo implied balance/art/production release approval.\n`:"Canonical Root Pack: NOT IMPORTED INTO THIS BROWSER.\n"}\n## Project status\nReported version: ${p.version||'Unknown'}\nStage: ${p.stage}\nSource confidence: ${p.sourceStatus||'Unresolved'}\nLive check: ${p.liveStatus||'Not checked'}\nApproval: ${p.approval||'Pending'}\nLive URL: ${p.liveUrl||'Unresolved'}\nGitHub repo: ${p.repoUrl||'UNRESOLVED'}\nDesign source: ${p.designUrl||'UNRESOLVED'}\n\n## Direction\n${p.description||'No description'}\n\n## Next action\n${p.next||'Confirm next step with source evidence.'}\n\n## Existing constraints\n${p.notes||'Missing — recover canonical Blueprint and Root Pack.'}\n\n## Recorded decisions (not independently verified)\n${(p.decisions||[]).map(d=>`- ${d.date} [${d.status}] ${d.text}`).join('\n')||'- None recorded'}\n\n## Recorded evidence\n${(p.evidence||[]).map(e=>`- ${e.date} ${e.label} / ${e.url||'no URL'} / ${e.note}${e.attachment?' / Attached locally: '+e.attachment.name+' (use NEO HQ JSON backup to transfer file)':''}`).join('\n')||'- None recorded'}\n\n## Mandatory Work procedure\n1. VERIFY SOURCE. Use the existing v0.5.0 Work audit and owner-approved reconstructed canonical v1.0 when imported. Verify current source, commit, deployment, remote, and documents again in active workspace. Keep historic original missing and GitHub remote unresolved until evidence proves otherwise.\n2. Preserve existing design approvals, references/books, component system, save data and current live versions. Use Keep / Replace / Add and a backup.\n3. For visually judged decisions, show A/B/C and obtain explicit stage approval; visual approval does not approve gameplay mechanics.\n4. Do not overwrite game source, merge or deploy without required approval; never claim work complete without source and QA evidence.\n5. Update NEO HQ via exported JSON/human-verified record after changes. Work is not connected automatically to this page.\n`}
function workModal(p){const txt=workText(p);modal('Work handoff · '+p.name,`<p class="subtle">Copy this brief into ChatGPT Work. It explicitly blocks implementation on unverified source.</p><div class="bigcopy" id="brief">${esc(txt)}</div>`,`<button class="btn" data-close>Close</button><button class="btn" id="downloadBrief">↓ .md</button><button class="btn primary" id="copyBrief">Copy handoff</button>`);document.querySelector('#copyBrief').onclick=async()=>{try{await navigator.clipboard.writeText(txt);notify('Work brief copied')}catch{notify('Clipboard blocked. Download .md instead.')}};document.querySelector('#downloadBrief').onclick=()=>download(`${p.id}-WORK-HANDOFF.md`,txt,'text/markdown')}
function download(name,text,mime){const blob=new Blob([text],{type:mime+';charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportData(){download(`NEO_HQ_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2),'application/json');notify('Snapshot downloaded')}
function validateProjectPack(x){return !!(x&&x.pack_schema==='neo-hq.project-merge.v1'&&x.project_id==='infinite-ascent'&&x.pack_id==='IA-CANONICAL-20261022-v1'&&x.canonical_root_pack?.owner_decision==='APPROVED'&&x.canonical_root_pack?.record_id==='IA-DOC-20261022-001'&&x.canonical_root_pack?.document_authority==='NEW_RECONSTRUCTED_REPLACEMENT_CANONICAL'&&/^([a-f0-9]{64})$/.test(x.canonical_root_pack.sha256||'')&&x.game_source?.commit==='0197e8fe82bf9086e766a00b0549bd7f851aa343'&&x.audit?.verdict==='PARTIALLY VERIFIED'&&Array.isArray(x.decisions)&&x.decisions.length<=40&&x.decisions.every(d=>typeof d.id==='string'&&typeof d.text==='string'&&typeof d.date==='string'&&typeof d.status==='string')&&Array.isArray(x.evidence)&&x.evidence.length<=100&&x.evidence.every(e=>typeof e.id==='string'&&typeof e.label==='string'&&typeof e.note==='string'))}
function onProjectPack(file){if(!file)return;if(file.size>250*1024)return notify('Pack too large (250 KB max)');const rd=new FileReader();rd.onerror=()=>notify('Could not read the project pack');rd.onload=()=>{let x;try{x=JSON.parse(String(rd.result))}catch{return notify('Project pack is not valid JSON')}if(!validateProjectPack(x))return notify('Wrong pack schema / source / approval — no changes');const p=state.projects.find(z=>z.id===x.project_id);const existing=p?.canonicalRecord?.pack_id===x.pack_id;const other=state.projects.filter(z=>z.id!==x.project_id).length;modal('Review project-only merge',`<p><strong>${esc(x.project_name)}</strong> · ${esc(x.canonical_root_pack.document_version)}</p><p class="subtle">${esc(x.scope)}</p><div class="rows">${kv('Target project',esc(x.project_id))}${kv('Canonical approval',esc(x.canonical_root_pack.owner_decision_date))}${kv('Source',esc(x.game_source.version)+' · '+esc(x.game_source.commit))}${kv('Audit',esc(x.audit.verdict))}${kv('Other projects preserved',esc(other+' (no change)'))}${kv('Existing records',esc(existing?'Existing canonical pack detected — reimport is idempotent':'Will merge project evidence/decisions'))}</div><p class="footnote">Export a full browser safety backup before merging. The merge updates only this project's audit/document metadata and appends uniquely identified evidence/decisions; existing freeform notes and local file attachments are preserved.</p>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="applyProjectMerge">Export backup & merge</button>`);document.querySelector('#applyProjectMerge').onclick=()=>{exportData();const previous=copyObj(state);try{applyProjectPack(x);if(!save())throw Error('Storage unavailable');close();navigate('detail',x.project_id);notify('INFINITE ASCENT merged locally; other projects preserved')}catch(e){state=previous;notify('Merge failed — original data restored')}}};rd.readAsText(file)}
function applyProjectPack(x){if(!validateProjectPack(x))throw Error('Invalid merge pack');let p=state.projects.find(v=>v.id===x.project_id);if(!p){p={id:'infinite-ascent',name:'INFINITE ASCENT',category:'Game · RPG',description:'Fantasy survival RPG; existing playable browser game.',version:'',liveUrl:x.deployment?.url||'',repoUrl:'',designUrl:'',stage:'Audit',sourceStatus:'Unresolved',liveStatus:'Not checked',approval:'Pending',next:'',notes:'',priority:'Pilot',evidence:[],decisions:[]};state.projects.push(p)}if(!Array.isArray(p.evidence))p.evidence=[];if(!Array.isArray(p.decisions))p.decisions=[];p.canonicalRecord=copyObj(x);if(!p.version||/target reported/i.test(p.version))p.version='v0.5.0 · Work-verified 2026-10-22';if(!p.liveUrl)p.liveUrl=x.deployment?.url||'';if(['Unresolved','Not checked'].includes(p.sourceStatus))p.sourceStatus='Verified · local source only';if(p.liveStatus==='Not checked')p.liveStatus='Confirmed';if(p.approval==='Pending')p.approval='Root Pack only';if(!p.next||/Recover and confirm actual latest source/i.test(p.next))p.next=x.next_action;if(!p.notes||/Prior v0\.4\.2 live build reported; v0\.5\.0 not source-verified/i.test(p.notes)){p.notes=x.notes}else if(!p.notes.includes('IA-DOC-20261022-001'))p.notes+='\n\nCanonical document: '+x.notes+' [IA-DOC-20261022-001]';for(const e of x.evidence){if(!p.evidence.some(v=>v.importId===e.id))p.evidence.push({importId:e.id,label:e.label,date:e.date||x.created_date,url:e.url||'',note:e.note})}for(const d of x.decisions){if(!p.decisions.some(v=>v.importId===d.id))p.decisions.push({importId:d.id,date:d.date,status:d.status,text:d.text})}}
function onImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{let x;try{x=JSON.parse(String(reader.result))}catch{return notify('Not valid JSON')}if(!validate(x))return notify('Wrong schema or malformed project records');if(!confirm(`Replace browser records with ${x.projects.length} projects? A safety backup will download first.`))return;exportData();state=copyObj(x);save();close();navigate('projects');notify('Snapshot imported locally')};reader.readAsText(file)}
function act(e){const node=e.target.closest('[data-nav],[data-open],[data-action],[data-close]');if(!node)return;if(node.dataset.close!==undefined){close();return}if(node.dataset.nav){navigate(node.dataset.nav);return}if(node.dataset.open){navigate('detail',node.dataset.open);return}if(node.dataset.action){const p=state.projects.find(x=>x.id===activeId);switch(node.dataset.action){case'export':return exportData();case'add':return formProject();case'import':return document.querySelector('#fileImport')?.click();case'merge-pack':return document.querySelector('#fileProjectPack')?.click();case'edit':return formProject(p);case'evidence':return addEvidence(p);case'attachment':return downloadAttachment(p?.evidence?.[Number(node.dataset.index)]);case'decision':return addDecision(p);case'handoff':return workModal(p)}}}
document.addEventListener('click',act);document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&e.target.matches('[data-open]'))navigate('detail',e.target.dataset.open)});document.addEventListener('input',e=>{if(e.target.id==='filterSearch'){q=e.target.value;const focus=e.target.selectionStart;const selected=document.querySelector('#stageFilter')?.value||'All';stageFilter=selected;const arr=state.projects.filter(p=>(!q||[p.name,p.category,p.description,p.version].join(' ').toLowerCase().includes(q.toLowerCase()))&&(stageFilter==='All'||p.stage===stageFilter));document.querySelector('#projectGrid').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">No matching projects.</div>'}});document.addEventListener('change',e=>{if(e.target.id==='stageFilter'){stageFilter=e.target.value;render()}if(e.target.id==='fileImport')onImport(e.target.files[0]);if(e.target.id==='fileProjectPack'){const file=e.target.files?.[0];e.target.value='';onProjectPack(file)}});load();render();
})();
